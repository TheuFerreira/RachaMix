<section class="phone-screen players-screen">
  <div class="screen-title">
    <div class="title-icon">&#9917;</div>
    <h1>Jogadores</h1>
    <button
      class="icon-btn"
      aria-label="Importar jogadores"
      title="Importar jogadores"
      (click)="importPlayers.emit()"
    >
      &#9881;
    </button>
  </div>
  <div class="segmented">
    <button [class.active]="activeSection === 'all'" (click)="setSection('all')">
      Todos <b>({{ players.length }})</b>
    </button>
    <button [class.active]="activeSection === 'line'" (click)="setSection('line')">
      Linha <b>({{ linePlayers.length }})</b>
    </button>
    <button [class.active]="activeSection === 'goalkeeper'" (click)="setSection('goalkeeper')">
      Goleiros <b>({{ goalkeepers.length }})</b>
    </button>
  </div>
  <div class="search-row">
    <div class="search-box">
      &#128269;
      <input [(ngModel)]="search" placeholder="Buscar jogador..." aria-label="Buscar jogador" />
    </div>
  </div>

  @if (activeSection === 'all' || activeSection === 'line') {
    <app-player-section
      title="Jogadores de linha"
      icon="&#x1F3C3;"
      type="line"
      [players]="filteredLinePlayers"
      [total]="linePlayers.length"
      [collapsible]="activeSection === 'all'"
      (remove)="requestRemovePlayer($event)"
      (edit)="edit.emit($event)"
    />
  }
  @if (activeSection === 'all' || activeSection === 'goalkeeper') {
    <app-player-section
      title="Goleiros"
      icon="&#x1F590;"
      type="goalkeeper"
      [players]="filteredGoalkeepers"
      [total]="goalkeepers.length"
      [collapsible]="activeSection === 'all'"
      (remove)="requestRemovePlayer($event)"
      (edit)="edit.emit($event)"
    />
  }

  @if (playerPendingRemoval) {
    <div class="remove-backdrop" (click)="cancelRemovePlayer()">
      <section
        class="remove-dialog"
        role="alertdialog"
        aria-modal="true"
        aria-labelledby="remove-player-title"
        (click)="$event.stopPropagation()"
      >
        <h2 id="remove-player-title">Excluir jogador?</h2>
        <p>
          Tem certeza que deseja excluir <strong>{{ playerPendingRemoval.name }}</strong
          >?
        </p>
        <div class="remove-actions">
          <button type="button" class="secondary-btn" (click)="cancelRemovePlayer()">
            Cancelar
          </button>
          <button type="button" class="danger-btn" (click)="confirmRemovePlayer()">Excluir</button>
        </div>
      </section>
    </div>
  }

  <button class="primary-btn add-player" (click)="add.emit()">Adicionar jogador</button>
</section>
