<div
  class="player-group app-card rounded-3 mb-2 overflow-hidden"
  [class.line-section]="type === 'line'"
  [class.keeper-section]="type === 'goalkeeper'"
>
  <div class="group-heading d-flex align-items-center gap-2 px-3 py-2">
    <span class="player-type-icon" aria-hidden="true">{{ typeIcon }}</span>
    <strong class="flex-grow-1">{{ title }} ({{ total }})</strong>
    <span>›</span>
  </div>

  @for (player of visiblePlayers; track player.name) {
    <div
      class="player-row app-player-row d-flex align-items-center gap-2 w-100 px-2 py-1 border-0"
      role="button"
      tabindex="0"
      [attr.aria-label]="'Editar jogador ' + player.name"
      (click)="edit.emit(player)"
      (keydown)="activatePlayer($event, player)"
    >
      <span class="avatar app-avatar rounded-circle">{{ player.initials }}</span>
      <span class="player-name app-player-name flex-grow-1">{{ player.name }}</span>
      <span
        class="tag app-tag rounded-2"
        [class.line-tag]="type === 'line'"
        [class.keeper-tag]="type === 'goalkeeper'"
      >
        <span class="player-type-icon" aria-hidden="true">{{ typeIcon }}</span>
        {{ typeLabel }}
      </span>
      <button
        type="button"
        class="row-action delete-action btn p-0"
        aria-label="Excluir jogador"
        title="Excluir jogador"
        (click)="$event.stopPropagation(); remove.emit(player)"
      >
        <svg viewBox="0 0 16 16" aria-hidden="true">
          <path d="M3 5.5h10M6 5.5V4h4v1.5M5 7v5.5h6V7M7 8.5v2.5M9 8.5v2.5" />
        </svg>
      </button>
    </div>
  }

  @if (collapsible && players.length > 5) {
    <button
      type="button"
      class="see-all btn w-100 py-2"
      [attr.aria-expanded]="showAll"
      (click)="toggleExpanded()"
    >
      {{ showAll ? 'Ver menos' : 'Ver todos' }} ({{ players.length }})
      <span>{{ showAll ? '⌃' : '⌄' }}</span>
    </button>
  }
</div>
