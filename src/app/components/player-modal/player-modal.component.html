<div class="modal-backdrop" (click)="close()">
  <section
    #modal
    class="player-modal app-modal rounded-4 p-4"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="isEditMode ? 'edit-player-title' : 'add-player-title'"
    (click)="$event.stopPropagation()"
    (keydown)="handleKeydown($event)"
  >
    <div class="modal-header d-flex align-items-center justify-content-between gap-3">
      <h2 [id]="isEditMode ? 'edit-player-title' : 'add-player-title'">
        {{ isEditMode ? 'Editar jogador' : 'Adicionar jogador' }}
      </h2>
      <button
        type="button"
        class="modal-close btn p-0 flex-shrink-0"
        aria-label="Fechar"
        (click)="close()"
      >
        &times;
      </button>
    </div>

    <label for="player-modal-name">Nome</label>
    <input
      class="form-control"
      id="player-modal-name"
      type="text"
      #nameInput
      [(ngModel)]="name"
      placeholder="Digite o nome do jogador"
      minlength="2"
      autocomplete="off"
      (blur)="markNameAsTouched()"
      (keyup.enter)="save()"
    />
    @if (nameTouched && nameError) {
      <small class="field-error">{{ nameError }}</small>
    }

    <label for="player-modal-type">Posição</label>
    <div class="select-field">
      <button
        id="player-modal-type"
        type="button"
        class="select-trigger btn w-100 d-flex align-items-center justify-content-between text-start"
        [class.open]="isTypeMenuOpen"
        [attr.aria-expanded]="isTypeMenuOpen"
        aria-haspopup="listbox"
        (click)="toggleTypeMenu()"
      >
        <span class="position-value">
          @if (type === 'line') {
            <span class="position-icon" aria-hidden="true">{{ typeIcon }}</span>
            Linha
          } @else {
            <span class="position-icon" aria-hidden="true">{{ typeIcon }}</span>
            Goleiro
          }
        </span>
        <span class="select-chevron"></span>
      </button>
      @if (isTypeMenuOpen) {
        <div class="select-options" role="listbox" aria-label="Posição do jogador">
          <button
            type="button"
            role="option"
            [attr.aria-selected]="type === 'line'"
            [class.selected]="type === 'line'"
            (click)="selectType('line')"
          >
            <span class="position-icon" aria-hidden="true">{{ getTypeIcon('line') }}</span>
            Linha
          </button>
          <button
            type="button"
            role="option"
            [attr.aria-selected]="type === 'goalkeeper'"
            [class.selected]="type === 'goalkeeper'"
            (click)="selectType('goalkeeper')"
          >
            <span class="position-icon" aria-hidden="true">{{ getTypeIcon('goalkeeper') }}</span>
            Goleiro
          </button>
        </div>
      }
    </div>

    <div class="modal-actions d-flex justify-content-end gap-2">
      <button type="button" class="secondary-btn btn" (click)="close()">Cancelar</button>
      <button
        type="button"
        class="primary-btn btn"
        [disabled]="name.trim().length < 2 || !!nameError"
        (click)="save()"
      >
        {{ isEditMode ? 'Salvar' : 'Adicionar' }}
      </button>
    </div>
  </section>
</div>
