<main class="app-shell">
  <header class="brand-bar">
    <div class="brand-mark">⚽</div>
    <div>
      <span class="eyebrow">RACHA MIX</span>
      <strong>Seu jogo, do seu jeito.</strong>
    </div>
    <button class="icon-btn" aria-label="Configurações">⚙</button>
  </header>

  <section class="screen-grid">
    @if (activeTab === "players") {
      <app-players-page
        [players]="players"
        (add)="openAddPlayerModal()"
        (edit)="openEditPlayerModal($event)"
        (importPlayers)="openImportPlayersModal()"
        (remove)="removePlayer($event)"
      />
    }
    @if (activeTab === "draw") {
      <app-draw-page
        [players]="players"
        [playersPerTeam]="playersPerTeam"
        (back)="setTab('players')"
        (playersPerTeamChange)="playersPerTeam = $event"
        (generate)="generateDraw($event); setTab('history')"
      />
    }
    @if (activeTab === "history") {
      <app-results-page
        [players]="players"
        [teams]="drawnTeams"
        [goalkeepers]="drawnGoalkeepers"
        (back)="setTab('draw')"
        (redraw)="redraw()"
      />
    }
  </section>

  @if (isAddPlayerModalOpen) {
    <app-player-modal
      mode="add"
      [existingPlayers]="players"
      (closed)="closeAddPlayerModal()"
      (saved)="addPlayer($event)"
    />
  }

  @if (isEditPlayerModalOpen) {
    <app-player-modal
      mode="edit"
      [player]="editingPlayer"
      [existingPlayers]="players"
      (closed)="closeEditPlayerModal()"
      (saved)="saveEditedPlayer($event)"
    />
  }

  @if (isImportPlayersModalOpen) {
    <app-import-players-modal
      [existingPlayers]="players"
      (closed)="closeImportPlayersModal()"
      (imported)="importPlayers($event)"
    />
  }

  <nav class="bottom-nav">
    <button
      [class.active]="activeTab === 'players'"
      (click)="setTab('players')"
    >
      <span>♟</span>Jogadores
    </button>
    <button [class.active]="activeTab === 'draw'" (click)="setTab('draw')">
      <span>♧</span>Sortear
    </button>
    <button
      [class.active]="activeTab === 'history'"
      (click)="setTab('history')"
    >
      <span>◷</span>Times sorteados
    </button>
  </nav>
</main>
